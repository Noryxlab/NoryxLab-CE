# Continuous integration for the Community Edition.
#
# The boundary job is the reason this file exists. The CE/EE boundary has
# closed twice under delivery pressure (ADR-035), and both times nothing
# objected until someone read the repository months later. A check that only
# runs when a person remembers to run it is a check that reports the state of
# someone's memory.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary:
    name: CE/EE boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - run: ./scripts/check-edition-boundary.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noryx
          POSTGRES_PASSWORD: test
          POSTGRES_DB: noryx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noryx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: |
          unformatted=$(gofmt -l backend)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi
      - run: go -C backend vet ./...

      # The API document against the router. It described a fifth of the API
      # for months and nothing said so; this is what stops that returning.
      - name: The API document covers every route
        run: python3 scripts/ops/generate-openapi.py --check

      - name: The embedded system Dockerfiles match environments/
        run: python3 scripts/ops/embed-system-dockerfiles.py --check
      - run: go -C backend test ./...

      # The initial floor is intentionally below the 18% baseline measured on
      # the public tree. It prevents a silent collapse while new tests raise
      # coverage; every increase is a deliberate pull-request change.
      - name: Backend coverage does not regress below 15 percent
        run: |
          go -C backend test -coverpkg=./... -coverprofile=coverage.out ./...
          coverage=$(go -C backend tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Backend statement coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { exit !(coverage >= 15) }'

      # The store that actually runs in production cannot be tested without a
      # database: what is worth checking there is what Postgres enforces - a
      # partial unique index, an ON CONFLICT clause, a column a migration added.
      # These tests skip loudly when the DSN is absent, so without this service
      # they would pass while checking nothing.
      - name: Store tests against a real database
        env:
          NORYX_TEST_POSTGRES_DSN: postgres://noryx:test@127.0.0.1:5432/noryx?sslmode=disable
        run: go -C backend test ./internal/store/postgres/ -v

  inventory:
    name: Software inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # A licence document that drifts from the dependencies it describes is
      # worse than none: it is wrong and looks authoritative. Regenerating and
      # comparing is the only way it stays true without anyone remembering to
      # check.
      # Compared by content, not by `git diff`: the document records when it was
      # generated, so diffing the regenerated file against the committed one
      # failed on every run whatever the dependencies were doing - and a check
      # that always fails is one nobody reads.
      - name: The committed inventory matches the dependencies
        run: python3 scripts/ops/generate-software-inventory.py --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Asserts the built output rather than the sources: the 2026-05-04
      # incident shipped a bundle that no source-level check would have caught.
      - run: npm run smoke

  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The CLI is deliberately used instead of gitleaks-action: the latter
      # requires a commercial key for GitHub organisations. Scanning the full
      # checkout still catches a secret committed then removed later.
      - name: Scan Git history for secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --config=/repo/.gitleaks.toml --source=/repo --log-opts="--all" --redact

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Scan Go dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          (cd backend && govulncheck ./...)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Scan production npm dependencies for known vulnerabilities
        run: npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Scan repository configuration for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  container-security:
    name: Container security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build Community images
        run: |
          docker build -t noryx-backend:ci backend
          docker build -t noryx-frontend:ci frontend
      - name: Scan backend image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: noryx-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: noryx-frontend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  kubernetes:
    name: Kubernetes manifest admission
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Create isolated Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: noryx-ci
          wait: 90s
      - name: Render and admit Community manifests
        run: ./scripts/ci/kind-smoke.sh

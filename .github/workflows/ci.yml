# Continuous integration for the Community Edition.
#
# The boundary job is the reason this file exists. The CE/EE boundary has
# closed twice under delivery pressure (ADR-035), and both times nothing
# objected until someone read the repository months later. A check that only
# runs when a person remembers to run it is a check that reports the state of
# someone's memory.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary:
    name: CE/EE boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - run: ./scripts/check-edition-boundary.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: |
          unformatted=$(gofmt -l backend)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi
      - run: go -C backend vet ./...
      - run: go -C backend test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Asserts the built output rather than the sources: the 2026-05-04
      # incident shipped a bundle that no source-level check would have caught.
      - run: npm run smoke

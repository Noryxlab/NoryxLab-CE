apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: noryx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: keycloak
          # Conservative hardening: no privilege escalation, no Linux capabilities,
          # the runtime's default seccomp profile. Deliberately not setting
          # runAsNonRoot or a read-only root filesystem here - both depend on what
          # each image expects, and a wrong guess is an outage rather than a denial.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # The JVM sizes its heap from the container limit, so an absent limit is also an unbounded heap.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          image: harbor.example.local/noryx-ce/keycloak:26.6.2
          args:
            - "start-dev"
            - "--http-relative-path=/auth"
            - "--proxy-headers=xforwarded"
            - "--hostname=datalab.example.local"
            - "--hostname-strict=false"
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /auth/realms/master
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/realms/master
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noryx-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            # sslmode=prefer, not require: Keycloak holds the accounts, and it
            # must keep starting on an installation whose Postgres has no
            # certificate yet. Prefer encrypts whenever the server offers TLS,
            # which it does as soon as scripts/ops/enable-postgres-tls.sh has
            # run - so a platform gets encryption without an ordering rule
            # somebody has to remember.
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/noryx?sslmode=prefer
            - name: KC_DB_USERNAME
              value: noryx
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noryx-secrets
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: noryx
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: noryx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: noryx
spec:
  replicas: 1
  # Recreate, not RollingUpdate. This deployment owns a ReadWriteOnce volume,
  # and a rolling update starts the new pod before stopping the old one: the
  # volume is already attached, so the new pod waits on a Multi-Attach error
  # until the rollout times out and the change silently never lands. It cost a
  # ten-minute stall on EMSE, whose Longhorn volumes enforce this properly -
  # the DC never showed it, because local-path volumes on one node do not.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      securityContext:
        # The postgres user's group, so a key mounted 0640 and owned by root is
        # readable by the server and by nobody else.
        fsGroup: 999
      containers:
        - name: postgres
          # No securityContext here, and that is deliberate. Dropping ALL
          # capabilities crashed this container on 2026-09-05: the official
          # Postgres entrypoint starts as root to chown PGDATA and drop to the
          # postgres user, so it needs CHOWN, FOWNER, SETUID and SETGID. Without
          # them it fails with "chmod: Operation not permitted" and the platform
          # loses its database.
          #
          # Restricting it properly means running the container as uid 999 with
          # a volume already owned by it - a change to make on its own, with the
          # volume, not as a line added to a hardening pass.
          # Postgres holds the platform: it gets a floor worth scheduling on and a ceiling below the node.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
          image: harbor.example.local/noryx-ce/postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: noryx
            - name: POSTGRES_USER
              value: noryx
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noryx-secrets
                  key: POSTGRES_PASSWORD
            # No PGDATA. The manifest used to set it to a `pgdata` subdirectory
            # while every running installation had its cluster at the volume
            # root - the two had drifted, and nobody could see it because a
            # deployment that is never reapplied never reveals a difference.
            #
            # It surfaced during the namespace migration on 2026-09-05: the new
            # Postgres found `pgdata` empty, ran initdb, and came up as a
            # pristine database with one Keycloak realm. The real cluster was
            # untouched one directory above. Nothing was lost, and the ten
            # minutes spent proving that is the reason this line is gone.
          # TLS if a certificate has been mounted, plain otherwise.
          #
          # The connection between the backend and its database crossed the
          # cluster in the clear, with `sslmode=disable`, because the server had
          # `ssl off` - and making the client stricter without the server
          # supporting it is an outage, so neither half could move alone.
          #
          # Written as a condition rather than a flag: an installation with no
          # certificate keeps starting exactly as before, and one that has been
          # given a certificate uses it from the next restart. The secret comes
          # from scripts/ops/enable-postgres-tls.sh.
          #
          # `ssl_key_file` must not be group- or world-readable unless it is
          # owned by root, which is why the secret is mounted 0640 and the pod
          # runs with fsGroup 999 - the postgres user's group.
          command:
            - sh
            - -c
            - |
              if [ -f /etc/postgres-tls/tls.crt ] && [ -f /etc/postgres-tls/tls.key ]; then
                exec docker-entrypoint.sh postgres \
                  -c ssl=on \
                  -c ssl_cert_file=/etc/postgres-tls/tls.crt \
                  -c ssl_key_file=/etc/postgres-tls/tls.key
              fi
              exec docker-entrypoint.sh postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-tls
          secret:
            secretName: postgres-tls
            optional: true
            defaultMode: 0640
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: noryx
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

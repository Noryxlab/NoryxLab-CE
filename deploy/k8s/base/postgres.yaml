apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: noryx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: noryx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: postgres
          # No securityContext here, and that is deliberate. Dropping ALL
          # capabilities crashed this container on 2026-09-05: the official
          # Postgres entrypoint starts as root to chown PGDATA and drop to the
          # postgres user, so it needs CHOWN, FOWNER, SETUID and SETGID. Without
          # them it fails with "chmod: Operation not permitted" and the platform
          # loses its database.
          #
          # Restricting it properly means running the container as uid 999 with
          # a volume already owned by it - a change to make on its own, with the
          # volume, not as a line added to a hardening pass.
          # Postgres holds the platform: it gets a floor worth scheduling on and a ceiling below the node.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
          image: harbor.example.local/noryx-ce/postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: noryx
            - name: POSTGRES_USER
              value: noryx
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noryx-secrets
                  key: POSTGRES_PASSWORD
            # No PGDATA. The manifest used to set it to a `pgdata` subdirectory
            # while every running installation had its cluster at the volume
            # root - the two had drifted, and nobody could see it because a
            # deployment that is never reapplied never reveals a difference.
            #
            # It surfaced during the namespace migration on 2026-09-05: the new
            # Postgres found `pgdata` empty, ran initdb, and came up as a
            # pristine database with one Keycloak realm. The real cluster was
            # untouched one directory above. Nothing was lost, and the ten
            # minutes spent proving that is the reason this line is gone.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: noryx
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

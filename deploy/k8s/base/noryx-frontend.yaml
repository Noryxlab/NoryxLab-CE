# Frontend deployment.
#
# The application itself lives in the container image, built from
# `frontend/` by its Dockerfile. This manifest used to embed the entire UI as
# a 9485-line ConfigMap holding one 504 KB index.html; the ConfigMap now
# carries only the runtime configuration, which is what actually differs
# between deployments.
#
# That split is what lets the EE overlay brand the product without running
# `sed` over the application source: it ships its own config.js.
apiVersion: v1
kind: ConfigMap
metadata:
  name: noryx-frontend-config
  namespace: noryx-ce
  labels:
    app: noryx-frontend
data:
  config.js: |
    window.__NORYX_CONFIG__ = {
      apiBaseUrl: '',
      authMode: 'oidc',
      oidc: {
        url: 'https://auth.example.local',
        realm: 'noryx',
        clientId: 'noryx-frontend'
      },
      edition: 'ce',
      defaultLocale: 'fr',
      brand: {
        productName: 'NoryxLab',
        editionLabel: 'Community Edition',
        logoUrl: '/favicon.svg',
        tokens: {}
      },
      links: {
        documentation: 'https://docs.noryxlab.ai',
        apiReference: '/swagger',
        status: 'https://status.noryxlab.ai'
      },
      features: {
        requireOrganization: false
      }
    };
  version.json: |
    {"version":"ce-web-0.7.0"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noryx-frontend
  namespace: noryx-ce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noryx-frontend
  template:
    metadata:
      labels:
        app: noryx-frontend
      annotations:
        # Rolls the pods when the runtime configuration changes, since nginx
        # serves config.js from disk and will not notice a ConfigMap update.
        noryx.io/config-checksum: "replace-on-config-change"
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: noryx-frontend
          image: harbor.example.local/noryx-ce/noryx-frontend:ce-web-0.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: front-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
            - name: front-config
              mountPath: /usr/share/nginx/html/version.json
              subPath: version.json
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: front-config
          configMap:
            name: noryx-frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: noryx-frontend
  namespace: noryx-ce
spec:
  selector:
    app: noryx-frontend
  ports:
    - port: 80
      targetPort: 80

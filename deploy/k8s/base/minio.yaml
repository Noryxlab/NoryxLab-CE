apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: noryx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: noryx
spec:
  replicas: 1
  # Recreate, not RollingUpdate. This deployment owns a ReadWriteOnce volume,
  # and a rolling update starts the new pod before stopping the old one: the
  # volume is already attached, so the new pod waits on a Multi-Attach error
  # until the rollout times out and the change silently never lands. It cost a
  # ten-minute stall on EMSE, whose Longhorn volumes enforce this properly -
  # the DC never showed it, because local-path volumes on one node do not.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: minio
          # Conservative hardening: no privilege escalation, no Linux capabilities,
          # the runtime's default seccomp profile. Deliberately not setting
          # runAsNonRoot or a read-only root filesystem here - both depend on what
          # each image expects, and a wrong guess is an outage rather than a denial.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # MinIO buffers uploads in memory; a large upload with no limit is a node eviction.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          image: harbor.example.local/noryx-ce/minio:RELEASE.2025-02-18T16-25-55Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: noryx
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noryx-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: noryx
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

apiVersion: v1
kind: ServiceAccount
metadata:
  name: noryx-backend
  namespace: noryx
---
# The backend used to hold every one of these rights in a ClusterRole, which
# meant cluster-wide `secrets: list` - Longhorn's, Keycloak's, Harbor's, and
# every other namespace's. A compromised backend was a compromised cluster.
#
# It actually talks to exactly two namespaces (the control namespace where it
# runs, and the workload namespace where user pods live), so those rights are
# now Roles bound in each. Only persistent volumes stay cluster-scoped, because
# a PersistentVolume genuinely has no namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: noryx-backend-runtime
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noryx-backend-runtime
subjects:
  - kind: ServiceAccount
    name: noryx-backend
    namespace: noryx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: noryx-backend-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: noryx-backend-runtime
  namespace: noryx
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: noryx-backend-runtime
  namespace: noryx
subjects:
  - kind: ServiceAccount
    name: noryx-backend
    namespace: noryx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: noryx-backend-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: noryx-backend-runtime
  namespace: noryx-loads
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: noryx-backend-runtime
  namespace: noryx-loads
subjects:
  - kind: ServiceAccount
    name: noryx-backend
    namespace: noryx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: noryx-backend-runtime
---
# Reading how much room the storage layer has left.
#
# Kubernetes does not answer this: a claim is accepted on sight and fails much
# later, at attach time, on a pod nobody is reading - so an installation can be
# one workspace away from refusing everybody with nothing on any screen saying
# so. Only the provisioner knows, and on these installations that is Longhorn.
#
# Two resources, read only, in one namespace. No secrets, no writes, nothing
# that touches a volume's contents: this grant can report that the cluster is
# full and can do nothing about it. An installation that does not apply it, or
# runs another storage layer, simply reports the capacity as unmeasurable - the
# platform degrades to saying it does not know, which is the honest answer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: noryx-backend-storage-capacity
  namespace: longhorn-system
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["nodes", "settings"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: noryx-backend-storage-capacity
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: noryx-backend
    namespace: noryx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: noryx-backend-storage-capacity

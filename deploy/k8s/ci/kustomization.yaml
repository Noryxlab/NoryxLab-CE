# CI-only composition. It is never applied to a customer cluster.
#
# It removes Traefik CRDs, replaces private Harbor references with images that a
# GitHub-hosted Kind cluster can obtain, and removes the private image pull
# secret. This exercises the same resource graph without embedding registry
# credentials in the public repository.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

images:
  - name: harbor.example.local/noryx-ce/noryx-backend
    newName: noryx-backend
    newTag: ci
  - name: harbor.example.local/noryx-ce/noryx-frontend
    newName: noryx-frontend
    newTag: ci
  - name: harbor.example.local/noryx-ce/postgres
    newName: postgres
    newTag: "16"
  - name: harbor.example.local/noryx-ce/keycloak
    newName: quay.io/keycloak/keycloak
    newTag: "26.6.2"
  # quay.io, not Docker Hub: MinIO stopped serving this tag there, and the
  # registry answers "repository does not exist" rather than anything about a
  # tag - so the job failed on an image nobody in this repository had touched.
  - name: harbor.example.local/noryx-ce/minio
    newName: quay.io/minio/minio
    newTag: "RELEASE.2025-02-18T16-25-55Z"

patches:
  # A stock Kind cluster has no Traefik CRDs. They are validated in the
  # deployment environment; this smoke validates the portable CE resource set.
  - target:
      group: traefik.io
      version: v1alpha1
      kind: Middleware
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: ignored-by-ci
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: ignored-by-ci
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
  # Longhorn's namespace does not exist on a stock Kind cluster, and a Role
  # placed in a namespace that is absent fails the whole apply - which is how
  # this job started failing on a change that had nothing wrong with it. Same
  # reasoning as the Traefik CRDs above: the object is validated where the
  # component it belongs to exists.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: noryx-backend-storage-capacity
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: noryx-backend-storage-capacity
        namespace: longhorn-system
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: noryx-backend-storage-capacity
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: noryx-backend-storage-capacity
        namespace: longhorn-system

# The secrets the graph references and a customer supplies. Values that exist
# so the objects can start, and nothing that would work anywhere: the point is
# to admit the resource graph, not to send mail or reach an object store.
secretGenerator:
  - name: noryx-mail-bridge
    literals:
      - NORYX_MAIL_RELAY_URL=http://mail.invalid
      - NORYX_MAIL_TOKEN=ci
  - name: noryx-backup-target
    literals:
      - bucket=ci
      - endpoint=http://object.invalid
      - accessKey=ci
      - secretKey=ci
  - name: noryx-identity-backup-key
    literals:
      - key=ci
generatorOptions:
  disableNameSuffixHash: true

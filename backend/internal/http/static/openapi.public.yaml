  /api/v1/datasets/{datasetID}/card:
    get:
      tags: [Datasets]
      summary: Read What This Dataset Says About Itself
      description: >-
        The declared card - study, population, purpose, what it must not be
        used for, legal basis, units, contact - with the control column beside
        it. None of that is inferable from any number of bytes, which is why it
        is declared rather than scanned.


        Never returned alone. Every declared figure the platform can measure is
        compared with the most recent scan, and each comparison carries its
        verdict, its method and the date of the measurement - a fresh
        comparison against a month-old scan is a month-old answer. A verdict of
        "not_checkable" is honest about a purpose; "unverified" means nothing
        has measured it yet, which is what a declared pseudonymisation reads as
        until a structure scan has run.
      operationId: getDatasetCard
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - name: datasetID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Datasets]
      summary: Declare What This Dataset Is
      description: >-
        Writes the declaration a reader needs in order to use a dataset they
        did not build. Empty fields stay empty and are shown as empty: an
        unanswered field is information, and filling it with a guess is what
        this exists to avoid.


        Each accepted edit increments the card version and records who wrote
        it, so an extract can cite the version it was cut against even after a
        later edit. A body declaring nothing clears the card. Dataset owner or
        global administrator, because a card is what the dataset asserts about
        itself to everybody who can see it.
      operationId: setDatasetCard
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - name: datasetID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

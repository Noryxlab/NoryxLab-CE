# The supported Noryx API: every endpoint an integration may build on.
# Generated from openapi.yaml by scripts/ops/generate-openapi.py - the
# operations marked x-noryx-internal are the interface's own and are not
# here, because they change with the screens that use them.
openapi: 3.0.3
info:
  title: Noryx API
  version: 1.0.0
  description: |
    The Noryx backend API, in full: every route the platform serves is
    described here, and a test fails the build when one is not.

    Entries generated from the router carry a summary derived from the
    handler's name; the ones that needed a human sentence have one. Both are
    checked against the router, so neither can drift.

    Authentication modes:
    - `Bearer` token (OIDC / Keycloak)
    - bootstrap compatibility header `X-Noryx-User` (lab mode)
servers:
  - url: /

tags:
  - name: Health
  - name: Projects
  - name: RBAC
  - name: Environments
  - name: Workloads
  - name: Secrets
  - name: Datasets
  - name: Repositories
  - name: Auth
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    xNoryxUser:
      type: apiKey
      in: header
      name: X-Noryx-User

  schemas:
    DatasetCredentialsUpdatedResponse:
      type: object
      properties:
        updated: { type: boolean }
    ActivityActor:
      type: object
      properties:
        actor: { type: string }
        events: { type: integer }
        lastSeen: { type: string, format: date-time }
    ActivityAction:
      type: object
      properties:
        action: { type: string }
        count: { type: integer }
    ActivityDay:
      type: object
      properties:
        day: { type: string }
        people: { type: integer }
        events: { type: integer }
    ActivityReportResponse:
      type: object
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        coversSince: { type: string, format: date-time }
        coversUntil: { type: string, format: date-time }
        totalEvents: { type: integer }
        people:
          type: array
          items: { $ref: '#/components/schemas/ActivityActor' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActivityAction' }
        daily:
          type: array
          items: { $ref: '#/components/schemas/ActivityDay' }
        actionsShown: { type: integer }
        actionsTotal: { type: integer }
    StorageCapacityNode:
      type: object
      properties:
        name: { type: string }
        claimed: { type: integer }
        schedulable: { type: integer }
        allocatable: { type: integer }
        freeDisk: { type: integer }
        headroomRatio: { type: number }
    StorageCapacityResponse:
      type: object
      properties:
        available: { type: boolean }
        source: { type: string }
        detail: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/StorageCapacityNode' }
        totalClaimed: { type: integer }
        totalSchedulable: { type: integer }
        totalAllocatable: { type: integer }
        totalFreeDisk: { type: integer }
        warnBelow: { type: number }
    AssignableRole:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        basedOn: { type: string }
        builtin: { type: boolean }
    AssignableRoleListResponse:
      type: object
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/AssignableRole' }
    Agent:
      type: object
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        projectId: { type: string }
        name: { type: string }
        mission: { type: string, description: The assignment, in the words its author wrote }
        schedule: { type: string, enum: [manual, hourly, daily] }
        actions:
          type: array
          description: What this agent may change. Empty means it only looks and reports.
          items: { type: string, enum: [restart_app, call_api] }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        lastReport: { type: string }
        lastQuiet: { type: boolean, description: The last run found nothing worth reporting }
    AgentTeam:
      type: object
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        projectId: { type: string }
        name: { type: string }
        purpose:
          type: string
          description: What the team works on, in its owner's words. Never parsed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentTeamListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentTeam' }
    AgentMandate:
      type: object
      description: >-
        One line of a team's written organisation. A mandate authorises an ask
        the capability rules already allow; it never grants an action the
        owner did not give.
      properties:
        id: { type: string }
        teamId: { type: string }
        leadId: { type: string }
        memberId: { type: string }
        action: { type: string }
        grantedByUserId:
          type: string
          description: The person who wrote it down.
        createdAt: { type: string, format: date-time }
    AgentMandateListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentMandate' }
    AgentListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
    JobDataset:
      type: object
      description: >-
        One mount as it was when the job started. The name and bucket travel
        with the identifier because a dataset renamed, moved or deleted since
        must still mean something to whoever reads this.
      properties:
        id: { type: string }
        name: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        readOnly:
          type: boolean
          description: Whether the job could have changed what it read.
    AgentRun:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        question:
          type: string
          description: >-
            What a person asked, when this run came from somebody talking to
            the agent rather than from its schedule.
        report: { type: string }
        quiet: { type: boolean }
        actions:
          type: array
          description: What the agent actually did, recorded from the calls that succeeded rather than read out of the report.
          items: { type: string }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    AgentRunListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentRun' }
    AIServicesStatus:
      type: object
      properties:
        configured: { type: boolean }
        mode: { type: string }
        capabilities: { type: object }
        detail: { type: string }
        checkedAt: { type: string, format: date-time }
    ServiceAccount:
      type: object
      description: A principal that is not a person. It cannot sign in; its credentials are tokens.
      properties:
        username: { type: string }
        purpose: { type: string }
        responsible:
          type: string
          description: The person who answers for this account. Required at creation.
        organizations:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        tokens:
          type: integer
          description: How many of its credentials are live.
    MountedProjectList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
        hidden:
          type: integer
          description: >-
            How many projects mount this object that the caller may not know
            about - not a member, or the project no longer exists.
    OntologyScanResult:
      type: object
      properties:
        manifest:
          type: object
          description: What the scan understood of the dataset's layout.
        item:
          $ref: '#/components/schemas/Ontology'
        changed:
          type: object
          description: >-
            What a refresh changed, and why. "Why" is the half that was
            missing: a subject count that moves is either the study recruiting
            or the reading changing, and those call for opposite reactions.
            Absent on a first scan, and absent when the previous manifest
            predates the reading rule being recorded - saying "the reading
            changed" when it may not have would send somebody after a rule they
            never edited.
          properties:
            readingChanged: { type: boolean }
            previousReading: { type: string }
            currentReading: { type: string }
            previousObjects: { type: integer }
            currentObjects: { type: integer }
            previousSubjects: { type: integer }
            currentSubjects: { type: integer }
        refreshed:
          type: boolean
          description: >-
            True when an ontology already describing this source was refreshed
            rather than a second one created. The screen says which happened,
            so nobody has to count rows to find out.
    ProjectWorkload:
      type: object
      properties:
        kind: { type: string, enum: [workspace, app, job] }
        id: { type: string }
        name: { type: string }
        status: { type: string }
    ProjectWorkloadList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectWorkload' }
        running:
          type: integer
          description: How many are consuming something right now.
    ServiceAccountList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ServiceAccount' }
    ServiceAccountDisabled:
      type: object
      properties:
        username: { type: string }
        tokensRevoked: { type: integer }
    ComponentTokenList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiToken' }
        scopes:
          type: array
          items: { type: string }
    ComponentTokenResponse:
      type: object
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret: { type: string }
        note: { type: string }
    WorkspaceStartupStep:
      type: object
      properties:
        key: { type: string }
        state: { type: string }
        detail: { type: string }
        technical: { type: string }
    WorkspaceStartup:
      type: object
      properties:
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceStartupStep' }
        stuck: { type: boolean }
    ProjectTokenResponse:
      type: object
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret: { type: string }
        note: { type: string }
    DatasetUsage:
      type: object
      properties:
        objects: { type: integer }
        totalBytes: { type: integer }
        truncated: { type: boolean }
        measuredAt: { type: string }
    DatasetCard:
      type: object
      properties:
        declared:
          type: boolean
          description: Whether anybody has written anything. Empty is legitimate.
        card:
          type: object
          nullable: true
          description: >-
            The declaration, as written. Carries its version, who wrote it and
            when.
        checks:
          type: array
          description: >-
            One line per checkable field, including the ones nobody declared -
            a reader who does not see a field cannot tell it apart from a field
            that passed.
          items:
            type: object
            properties:
              field: { type: string }
              verdict:
                type: string
                enum: [agrees, differs, undeclared, unverified, not_checkable]
              declared: { type: string }
              measured: { type: string }
              method:
                type: string
                description: How the measurement was obtained, named so a reader can judge it.
              at:
                type: string
                format: date-time
                description: When the measurement was taken, not when the comparison ran.
              note: { type: string }
        measuredBy: { type: string }
        measuredAt: { type: string, format: date-time }
    DatasetPathLayout:
      type: object
      properties:
        declared: { type: boolean }
        subjectLevel: { type: integer }
        visitLevel: { type: integer }
        modalityLevel: { type: integer }
        description:
          type: string
          description: The rule in words - "level 1 = subject, level 2 = visit".
    DatasetPathLayoutTrial:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              subject: { type: string }
              visit: { type: string }
              modality: { type: string }
        recognised: { type: integer }
        sampled: { type: integer }
        description: { type: string }
    DeletionCost:
      type: object
      properties:
        ontologies:
          type: integer
          description: Ontologies left describing a source that no longer exists.
        extracts:
          type: integer
          description: Frozen selections destroyed, or left without their ontology.
        objects:
          type: integer
          description: Scanned paths destroyed with the ontology.
    Extract:
      type: object
      properties:
        id:
          type: string
        layout:
          type: array
          items:
            type: string
            enum: [subject, visit, modality]
          description: >-
            The order of the directory levels a mount builds, and the other half
            of what an extract is. A selection says which files; a layout says
            how they are arranged to work on - subject-first answers "what does
            this patient have", modality-first answers "show me every cornea
            scan I hold". A permutation of the three levels, never a subset:
            dropping one would put files from different visits in the same
            directory, where the ones sharing a name would overwrite each other
            and the study would quietly lose rows. Absent means the default,
            subject first.
    ExtractListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Extract'
    ExtractMember:
      type: object
      properties:
        extractId:
          type: string
    ExtractMemberListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExtractMember'
    ExtractMembersResponse:
      type: object
      properties:
        extract: { $ref: '#/components/schemas/Extract' }
        members:
          type: array
          items: { $ref: '#/components/schemas/ExtractMember' }
        subjects:
          type: array
          items: { type: string }
        shown: { type: integer }
        total: { type: integer }
    BuildLogsResponse:
      type: object
      properties:
        buildId: { type: string }
        jobName: { type: string }
        projectId: { type: string }
        status: { type: string }
        podName: { type: string }
        logs: { type: string }
        pending: { type: boolean }
        unavailable: { type: string }
    ProjectVariable:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        description: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ProjectVariableListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectVariable' }
        canReadValues: { type: boolean }
    UsageSample:
      type: object
      properties:
        projectId:
          type: string
    UsageTotal:
      type: object
      properties:
        projectId:
          type: string
    Quota:
      type: object
      properties:
        projectId:
          type: string
    QuotaUsage:
      type: object
      properties:
        vcpu:
          type: number
    SMTPSettings:
      type: object
      properties:
        host:
          type: string
    DatasourceDefinition:
      type: object
      properties:
        id:
          type: string
    HealthResponse:
      type: object
      properties:
        status: { type: string }
    ProjectQuotaResponse:
      type: object
      properties:
        quota: { $ref: '#/components/schemas/Quota' }
        usage: { $ref: '#/components/schemas/QuotaUsage' }
        limited: { type: boolean }
    ProjectUsageResponse:
      type: object
      properties:
        total: { $ref: '#/components/schemas/UsageTotal' }
        samples:
          type: array
          items: { $ref: '#/components/schemas/UsageSample' }
    PlatformUsageResponse:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/UsageTotal' }
    SMTPSettingsResponse:
      type: object
      properties:
        settings: { $ref: '#/components/schemas/SMTPSettings' }
        configured: { type: boolean }
    SMTPTestResponse:
      type: object
      properties:
        sent: { type: boolean }
        recipient: { type: string }
    AdminEgressRuleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EgressRule' }
        profiles:
          type: array
          items: { type: string }
        enforced: { type: boolean }
    ProjectEgressRuleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EgressRule' }
        enforced: { type: boolean }
    DatasetAccessListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DatasetAccess' }
        canManage: { type: boolean }
    TeamUsageRow:
      type: object
      properties:
        teamId: { type: string }
        teamName: { type: string }
        members: { type: integer }
        projects: { type: integer }
        sharedProjects:
          type: integer
          description: How many of this team's projects another team also reaches.
        vcpuHours: { type: number }
        memoryGibHours: { type: number }
        peakVcpu: { type: number }
        samples:
          type: integer
          description: >-
            How many measurements the figure rests on, so a total built from
            three cannot be mistaken for one built from a month.
    TeamUsageReport:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: '#/components/schemas/TeamUsageRow' }
        platformVcpuHours:
          type: number
          description: What the platform actually consumed.
        attributedVcpuHours:
          type: number
          description: >-
            The sum of the rows. Larger than the platform total whenever teams
            share projects, which is why both are published.
        unattributedVcpuHours:
          type: number
          description: What no team reaches - held personally, or by an organization.
    Team:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        description: { type: string }
        organizationName: { type: string }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TeamListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    TeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    TeamMember:
      type: object
      properties:
        teamId: { type: string }
        userId: { type: string }
        joinedAt:
          type: string
          format: date-time
          description: >-
            When this person joined. Kept unchanged when they are added again,
            because it answers when they gained what the team grants.
    TeamMemberListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
    TeamMemberRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    ProjectTeamRole:
      type: object
      properties:
        teamId: { type: string }
        teamName: { type: string }
        role: { type: string }
    ProjectTeamRoleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectTeamRole' }
    ProjectOrganizationRole:
      type: object
      properties:
        organizationId: { type: string }
        organizationName: { type: string }
        role: { type: string }
    ProjectOrganizationRoleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectOrganizationRole' }
    DatasetDownloadURLResponse:
      type: object
      properties:
        url: { type: string }
        filename: { type: string }
        expiresAt: { type: string, format: date-time }
    AssistantModel:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        owned_by: { type: string }
    AssistantModelListResponse:
      type: object
      properties:
        object: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/AssistantModel' }
    BackupTargetStatus:
      type: object
      properties:
        configured: { type: boolean }
        endpoint: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        region: { type: string }
        updatedAt: { type: string, format: date-time }
    PlatformSetting:
      type: object
      properties:
        key: { type: string }
        kind: { type: string }
        label: { type: string }
        description: { type: string }
        values:
          type: array
          items: { type: string }
        fallback: { type: string }
        value: { type: string }
        source: { type: string }
        overridable: { type: boolean }
    PlatformSettingListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlatformSetting' }
    RBACPolicyRow:
      type: object
      properties:
        role: { type: string }
        key: { type: string }
        locked: { type: boolean }
        description: { type: string }
        project: { type: string }
        dataset: { type: string }
        ontology: { type: string }
        datasource: { type: string }
        environment: { type: string }
        workload: { type: string }
        governance: { type: string }
    RBACPolicyResponse:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/RBACPolicyRow' }
        assignmentCounts: { type: object }
        updatedAt: { type: string, format: date-time }
    DatasourceDefinitionListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DatasourceDefinition' }
    HardwareTierListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HardwareTier' }
    CronJobListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Job' }
    InvitationResponse:
      type: object
      properties:
        projectId: { type: string }
        userId: { type: string }
        role: { type: string }
        status: { type: string }
    VersionResponse:
      type: object
      description: What is running, as the platform reports it about itself.
      properties:
        backendVersion: { type: string }
        edition: { type: string, enum: [community, enterprise] }
    App:
      type: object
      properties:
        id:
          type: string
    AppListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
    Job:
      type: object
      properties:
        id:
          type: string
        datasets:
          type: array
          description: >-
            What this job had mounted when it ran, recorded on the job rather
            than left to be reconstructed from the project: a project's
            attachments change and a result does not. Empty for runs that
            predate this, which is different from a run that read nothing.
          items:
            $ref: '#/components/schemas/JobDataset'
    JobListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    Datasource:
      type: object
      properties:
        id:
          type: string
    DatasourceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Datasource'
    Ontology:
      type: object
      properties:
        id:
          type: string
    OntologyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ontology'
    ApiToken:
      type: object
      properties:
        id:
          type: string
    ApiTokenListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
    AdminHardwareTier:
      type: object
      properties:
        id:
          type: string
    AdminHardwareTierListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminHardwareTier'
    BackupRun:
      type: object
      properties:
        id:
          type: string
    BackupRunListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupRun'
    EgressRule:
      type: object
      properties:
        id:
          type: string
    EgressRuleListResponse:
      type: object
      properties:
        items:
          type: array
          items:

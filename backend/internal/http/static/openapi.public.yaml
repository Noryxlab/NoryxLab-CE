          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties:
            type: string

    WorkflowStep:
      type: object
      description: One unit of a workflow. The sequence is the order; the index is derived from the position.
      properties:
        index: { type: integer }
        kind: { type: string, enum: [agent, approval] }
        name: { type: string }
        instruction: { type: string, description: "The standing text for an agent step, in its author's words. Never parsed." }
        actions:
          type: array
          description: What an agent step may change, from the same closed list an agent holds.
          items: { type: string, enum: [restart_app, call_api] }
        approverUserId: { type: string, description: "Who an approval step waits for" }
    Workflow:
      type: object
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        projectId: { type: string }
        name: { type: string }
        schedule: { type: string, enum: [manual, hourly, daily] }
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStep' }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
    WorkflowListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Workflow' }
    WorkflowStepRun:
      type: object
      description: What happened at one step of one run. Actions are what the platform saw, never what the model said.
      properties:
        index: { type: integer }
        status: { type: string, enum: [pending, running, waiting_approval, succeeded, failed, cancelled] }
        attempts: { type: integer, description: "How many times this step was started; each attempt carries a new idempotency key" }
        output: { type: string, description: "What the step produced, handed to the next step as context" }
        actions:
          type: array
          items: { type: string }
        error: { type: string }
        approvedByUserId: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    WorkflowRun:
      type: object
      description: One execution, persisted after every step so that it can be resumed with no memory of the process that started it.
      properties:
        id: { type: string }
        workflowId: { type: string }
        status: { type: string, enum: [pending, running, waiting_approval, succeeded, failed, cancelled] }
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStepRun' }
        error: { type: string, description: "Which step failed and why, once the attempts are spent" }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    WorkflowRunListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkflowRun' }
    Workspace:
      type: object
      required: [id, projectId, kind, name, image, podName, serviceName, status, accessUrl, createdAt]

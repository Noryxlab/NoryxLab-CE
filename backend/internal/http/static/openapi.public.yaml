# The supported Noryx API: every endpoint an integration may build on.
# Generated from openapi.yaml by scripts/ops/generate-openapi.py - the
# operations marked x-noryx-internal are the interface's own and are not
# here, because they change with the screens that use them.
openapi: 3.0.3
info:
  title: Noryx API
  version: 1.0.0
  description: |
    The Noryx backend API, in full: every route the platform serves is
    described here, and a test fails the build when one is not.

    Entries generated from the router carry a summary derived from the
    handler's name; the ones that needed a human sentence have one. Both are
    checked against the router, so neither can drift.

    Authentication modes:
    - `Bearer` token (OIDC / Keycloak)
    - bootstrap compatibility header `X-Noryx-User` (lab mode)
servers:
  - url: /

tags:
  - name: Health
  - name: Projects
  - name: RBAC
  - name: Environments
  - name: Workloads
  - name: Secrets
  - name: Datasets
  - name: Repositories
  - name: Auth
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    xNoryxUser:
      type: apiKey
      in: header
      name: X-Noryx-User

  schemas:
    DatasetCredentialsUpdatedResponse:
      type: object
      properties:
        updated: { type: boolean }
    ActivityActor:
      type: object
      properties:
        actor: { type: string }
        events: { type: integer }
        lastSeen: { type: string, format: date-time }
    ActivityAction:
      type: object
      properties:
        action: { type: string }
        count: { type: integer }
    ActivityDay:
      type: object
      properties:
        day: { type: string }
        people: { type: integer }
        events: { type: integer }
    ActivityReportResponse:
      type: object
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        coversSince: { type: string, format: date-time }
        coversUntil: { type: string, format: date-time }
        totalEvents: { type: integer }
        people:
          type: array
          items: { $ref: '#/components/schemas/ActivityActor' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActivityAction' }
        daily:
          type: array
          items: { $ref: '#/components/schemas/ActivityDay' }
        actionsShown: { type: integer }
        actionsTotal: { type: integer }
    StorageCapacityNode:
      type: object
      properties:
        name: { type: string }
        claimed: { type: integer }
        schedulable: { type: integer }
        allocatable: { type: integer }
        freeDisk: { type: integer }
        headroomRatio: { type: number }
    StorageCapacityResponse:
      type: object
      properties:
        available: { type: boolean }
        source: { type: string }
        detail: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/StorageCapacityNode' }
        totalClaimed: { type: integer }
        totalSchedulable: { type: integer }
        totalAllocatable: { type: integer }
        totalFreeDisk: { type: integer }
        warnBelow: { type: number }
    AssignableRole:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        basedOn: { type: string }
        builtin: { type: boolean }
    AssignableRoleListResponse:
      type: object
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/AssignableRole' }
    Agent:
      type: object
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        projectId: { type: string }
        name: { type: string }
        mission: { type: string, description: The assignment, in the words its author wrote }
        schedule: { type: string, enum: [manual, hourly, daily] }
        actions:
          type: array
          description: What this agent may change. Empty means it only looks and reports.
          items: { type: string, enum: [restart_app] }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        lastReport: { type: string }
        lastQuiet: { type: boolean, description: The last run found nothing worth reporting }
    AgentTeam:
      type: object
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        projectId: { type: string }
        name: { type: string }
        purpose:
          type: string
          description: What the team works on, in its owner's words. Never parsed.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentTeamListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentTeam' }
    AgentMandate:
      type: object
      description: >-
        One line of a team's written organisation. A mandate authorises an ask
        the capability rules already allow; it never grants an action the
        owner did not give.
      properties:
        id: { type: string }
        teamId: { type: string }
        leadId: { type: string }
        memberId: { type: string }
        action: { type: string }
        grantedByUserId:
          type: string
          description: The person who wrote it down.
        createdAt: { type: string, format: date-time }
    AgentMandateListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentMandate' }
    AgentListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
    JobDataset:
      type: object
      description: >-
        One mount as it was when the job started. The name and bucket travel
        with the identifier because a dataset renamed, moved or deleted since
        must still mean something to whoever reads this.
      properties:
        id: { type: string }
        name: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        readOnly:
          type: boolean
          description: Whether the job could have changed what it read.
    AgentRun:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        question:
          type: string
          description: >-
            What a person asked, when this run came from somebody talking to
            the agent rather than from its schedule.
        report: { type: string }
        quiet: { type: boolean }
        actions:
          type: array
          description: What the agent actually did, recorded from the calls that succeeded rather than read out of the report.
          items: { type: string }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    AgentRunListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentRun' }
    AIServicesStatus:
      type: object
      properties:
        configured: { type: boolean }
        mode: { type: string }
        capabilities: { type: object }
        detail: { type: string }
        checkedAt: { type: string, format: date-time }
    ComponentTokenList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiToken' }
        scopes:
          type: array
          items: { type: string }
    ComponentTokenResponse:
      type: object
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret: { type: string }
        note: { type: string }
    WorkspaceStartupStep:
      type: object
      properties:
        key: { type: string }
        state: { type: string }
        detail: { type: string }
        technical: { type: string }
    WorkspaceStartup:
      type: object
      properties:
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceStartupStep' }
        stuck: { type: boolean }
    ProjectTokenResponse:
      type: object
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret: { type: string }
        note: { type: string }
    DatasetUsage:
      type: object
      properties:
        objects: { type: integer }
        totalBytes: { type: integer }
        truncated: { type: boolean }
        measuredAt: { type: string }
    Cohort:
      type: object
      properties:
        id:
          type: string
    CohortListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cohort'
    CohortMember:
      type: object
      properties:
        cohortId:
          type: string
    CohortMemberListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CohortMember'
    CohortMembersResponse:
      type: object
      properties:
        cohort: { $ref: '#/components/schemas/Cohort' }
        members:
          type: array
          items: { $ref: '#/components/schemas/CohortMember' }
        subjects:
          type: array
          items: { type: string }
        shown: { type: integer }
        total: { type: integer }
    BuildLogsResponse:
      type: object
      properties:
        buildId: { type: string }
        jobName: { type: string }
        projectId: { type: string }
        status: { type: string }
        podName: { type: string }
        logs: { type: string }
        pending: { type: boolean }
        unavailable: { type: string }
    ProjectVariable:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        description: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ProjectVariableListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectVariable' }
        canReadValues: { type: boolean }
    UsageSample:
      type: object
      properties:
        projectId:
          type: string
    UsageTotal:
      type: object
      properties:
        projectId:
          type: string
    Quota:
      type: object
      properties:
        projectId:
          type: string
    QuotaUsage:
      type: object
      properties:
        vcpu:
          type: number
    SMTPSettings:
      type: object
      properties:
        host:
          type: string
    DatasourceDefinition:
      type: object
      properties:
        id:
          type: string
    HealthResponse:
      type: object
      properties:
        status: { type: string }
    ProjectQuotaResponse:
      type: object
      properties:
        quota: { $ref: '#/components/schemas/Quota' }
        usage: { $ref: '#/components/schemas/QuotaUsage' }
        limited: { type: boolean }
    ProjectUsageResponse:
      type: object
      properties:
        total: { $ref: '#/components/schemas/UsageTotal' }
        samples:
          type: array
          items: { $ref: '#/components/schemas/UsageSample' }
    PlatformUsageResponse:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/UsageTotal' }
    SMTPSettingsResponse:
      type: object
      properties:
        settings: { $ref: '#/components/schemas/SMTPSettings' }
        configured: { type: boolean }
    SMTPTestResponse:
      type: object
      properties:
        sent: { type: boolean }
        recipient: { type: string }
    AdminEgressRuleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EgressRule' }
        profiles:
          type: array
          items: { type: string }
        enforced: { type: boolean }
    ProjectEgressRuleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EgressRule' }
        enforced: { type: boolean }
    DatasetAccessListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DatasetAccess' }
        canManage: { type: boolean }
    TeamUsageRow:
      type: object
      properties:
        teamId: { type: string }
        teamName: { type: string }
        members: { type: integer }
        projects: { type: integer }
        sharedProjects:
          type: integer
          description: How many of this team's projects another team also reaches.
        vcpuHours: { type: number }
        memoryGibHours: { type: number }
        peakVcpu: { type: number }
        samples:
          type: integer
          description: >-
            How many measurements the figure rests on, so a total built from
            three cannot be mistaken for one built from a month.
    TeamUsageReport:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: '#/components/schemas/TeamUsageRow' }
        platformVcpuHours:
          type: number
          description: What the platform actually consumed.
        attributedVcpuHours:
          type: number
          description: >-
            The sum of the rows. Larger than the platform total whenever teams
            share projects, which is why both are published.
        unattributedVcpuHours:
          type: number
          description: What no team reaches - held personally, or by an organization.
    Team:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        description: { type: string }
        organizationName: { type: string }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TeamListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    TeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    TeamMember:
      type: object
      properties:
        teamId: { type: string }
        userId: { type: string }
        joinedAt:
          type: string
          format: date-time
          description: >-
            When this person joined. Kept unchanged when they are added again,
            because it answers when they gained what the team grants.
    TeamMemberListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
    TeamMemberRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    ProjectTeamRole:
      type: object
      properties:
        teamId: { type: string }
        teamName: { type: string }
        role: { type: string }
    ProjectTeamRoleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectTeamRole' }
    ProjectOrganizationRole:
      type: object
      properties:
        organizationId: { type: string }
        organizationName: { type: string }
        role: { type: string }
    ProjectOrganizationRoleListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectOrganizationRole' }
    DatasetDownloadURLResponse:
      type: object
      properties:
        url: { type: string }
        filename: { type: string }
        expiresAt: { type: string, format: date-time }
    AssistantModel:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        owned_by: { type: string }
    AssistantModelListResponse:
      type: object
      properties:
        object: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/AssistantModel' }
    BackupTargetStatus:
      type: object
      properties:
        configured: { type: boolean }
        endpoint: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        region: { type: string }
        updatedAt: { type: string, format: date-time }
    PlatformSetting:
      type: object
      properties:
        key: { type: string }
        kind: { type: string }
        label: { type: string }
        description: { type: string }
        values:
          type: array
          items: { type: string }
        fallback: { type: string }
        value: { type: string }
        source: { type: string }
        overridable: { type: boolean }
    PlatformSettingListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlatformSetting' }
    RBACPolicyRow:
      type: object
      properties:
        role: { type: string }
        key: { type: string }
        locked: { type: boolean }
        description: { type: string }
        project: { type: string }
        dataset: { type: string }
        ontology: { type: string }
        datasource: { type: string }
        environment: { type: string }
        workload: { type: string }
        governance: { type: string }
    RBACPolicyResponse:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/RBACPolicyRow' }
        assignmentCounts: { type: object }
        updatedAt: { type: string, format: date-time }
    DatasourceDefinitionListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DatasourceDefinition' }
    HardwareTierListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HardwareTier' }
    CronJobListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Job' }
    InvitationResponse:
      type: object
      properties:
        projectId: { type: string }
        userId: { type: string }
        role: { type: string }
        status: { type: string }
    VersionResponse:
      type: object
      description: What is running, as the platform reports it about itself.
      properties:
        backendVersion: { type: string }
        edition: { type: string, enum: [community, enterprise] }
    App:
      type: object
      properties:
        id:
          type: string
    AppListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
    Job:
      type: object
      properties:
        id:
          type: string
        datasets:
          type: array
          description: >-
            What this job had mounted when it ran, recorded on the job rather
            than left to be reconstructed from the project: a project's
            attachments change and a result does not. Empty for runs that
            predate this, which is different from a run that read nothing.
          items:
            $ref: '#/components/schemas/JobDataset'
    JobListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    Datasource:
      type: object
      properties:
        id:
          type: string
    DatasourceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Datasource'
    Ontology:
      type: object
      properties:
        id:
          type: string
    OntologyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ontology'
    ApiToken:
      type: object
      properties:
        id:
          type: string
    ApiTokenListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
    AdminHardwareTier:
      type: object
      properties:
        id:
          type: string
    AdminHardwareTierListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminHardwareTier'
    BackupRun:
      type: object
      properties:
        id:
          type: string
    BackupRunListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupRun'
    EgressRule:
      type: object
      properties:
        id:
          type: string
    EgressRuleListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EgressRule'
    StorageEndpoint:
      type: object
      properties:
        id:
          type: string
    StorageEndpointListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StorageEndpoint'
    Organization:
      type: object
      properties:
        id:
          type: string
    OrganizationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    PlatformUser:
      type: object
      properties:
        id:
          type: string
    PlatformUserListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformUser'
    HealthEvent:
      type: object
      properties:
        id:
          type: string
    HealthEventListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HealthEvent'
    AuditEventListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    SoftwareInventoryItem:
      type: object
      properties:
        name:
          type: string
    SoftwareInventoryItemListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SoftwareInventoryItem'
    SoftwareInventory:
      type: object
      properties:
        generatedAt:
          type: string
    SoftwareInventoryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SoftwareInventory'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Project:
      type: object
      required: [id, name, ownerType, ownerId, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        ownerType:
          type: string
          enum: [user, organization]
        ownerId: { type: string }
        canManageOwner: { type: boolean }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        runningApps: { type: integer }
        runningJobs: { type: integer }
        runningWorkspaces: { type: integer }

    ProjectListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Fraud Analysis
        description:
          type: string
          example: Evaluation and deployment of fraud detection models.

    SetProjectOwnerRequest:
      type: object
      required: [ownerType, ownerId]
      properties:
        ownerType:
          type: string
          enum: [user, organization]
        ownerId:
          type: string

    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [viewer, editor, admin]

    SetRoleResponse:
      type: object
      required: [projectId, userId, role]
      properties:
        projectId: { type: string }
        userId: { type: string }
        role:
          type: string
          enum: [viewer, editor, admin]

    Build:
      type: object
      required: [id, projectId, gitRepository, destinationImage, jobName, status, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        gitRepository: { type: string }
        gitRef: { type: string }
        dockerfilePath: { type: string }
        dockerfileContent: { type: string }
        contextPath: { type: string }
        destinationImage: { type: string }
        jobName: { type: string }
        status: { type: string }
        createdAt:
          type: string
          format: date-time

    BuildListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Build'

    CreateBuildRequest:
      type: object
      required: [projectId, gitRepository, destinationImage]
      properties:
        projectId:
          type: string
        gitRepository:
          type: string
          example: https://github.com/Noryxlab/NoryxLab-CE.git
        gitRef:
          type: string
          example: main
        dockerfilePath:
          type: string
          example: environments/noryx-python/Dockerfile
        dockerfileContent:
          type: string
          description: Optional inline Dockerfile content (used instead of fetching from repository path).
        contextPath:
          type: string
          example: .
        destinationImage:
          type: string
          example: harbor.example.local/noryx-environments/noryx-python:0.2.2

    BuildDockerfileResponse:
      type: object
      required: [buildId, projectId, gitRepository, dockerfilePath, sourceUrl, content]
      properties:
        buildId: { type: string }
        projectId: { type: string }
        gitRepository: { type: string }
        gitRef: { type: string }
        dockerfilePath: { type: string }
        sourceUrl: { type: string }
        content:
          type: string

    EnvironmentRevision:
      type: object
      required: [buildId, destinationImage, status, createdAt]
      properties:
        buildId: { type: string }
        jobName: { type: string }
        status: { type: string }
        gitRepository: { type: string }
        gitRef: { type: string }
        dockerfilePath: { type: string }
        contextPath: { type: string }
        destinationImage: { type: string }
        createdAt:
          type: string
          format: date-time

    Environment:
      type: object
      required: [id, projectId, name, destinationImage, revisions]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        destinationImage: { type: string }
        latestBuildId: { type: string }
        latestStatus: { type: string }
        latestGitRepository: { type: string }
        latestGitRef: { type: string }
        latestDockerfilePath: { type: string }
        updatedAt:
          type: string
          format: date-time
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentRevision'

    EnvironmentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Environment'

    PodLaunch:
      type: object
      required: [id, projectId, podName, image, status, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        podName: { type: string }
        image: { type: string }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties:
            type: string
        status: { type: string }
        createdAt:
          type: string
          format: date-time

    PodLaunchListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PodLaunch'

    CreatePodRequest:
      type: object
      required: [projectId, image]
      properties:
        projectId: { type: string }
        podName: { type: string }
        image: { type: string }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties:
            type: string

    Workspace:
      type: object
      required: [id, projectId, kind, name, image, podName, serviceName, status, accessUrl, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        kind:
          type: string
          enum: [jupyter, vscode, rstudio]
        name: { type: string }
        image: { type: string }
        podName: { type: string }
        serviceName: { type: string }
        pvcName: { type: string }
        pvcClass: { type: string }
        pvcSize: { type: string }
        pvcMountPath: { type: string }
        cpu: { type: string }
        memory: { type: string }
        status: { type: string }
        accessUrl: { type: string }
        createdAt:
          type: string
          format: date-time

    HardwareTier:
      type: object
      required: [id, name, cpuLimit, memoryLimit, ephemeralStorageLimit, default]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        cpuLimit: { type: string }
        memoryLimit: { type: string }
        ephemeralStorageLimit: { type: string }
        default: { type: boolean }

    WorkspaceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'

    CreateWorkspaceRequest:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string }
        name: { type: string }
        ide:
          type: string
          enum: [jupyter, vscode, rstudio]
          example: jupyter
        storageSize:
          type: string
          description: PVC size override, e.g. `20Gi`.
          example: 20Gi
        hardwareTier:
          type: string
          description: Hardware tier identifier. Defaults to the platform default tier.

    Secret:
      type: object
      required: [id, name, type, isExpired, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isExpired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SecretReveal:
      type: object
      required: [id, name, type, value, isExpired, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        value: { type: string }
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isExpired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SecretListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Secret'

    UpsertSecretRequest:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          example: git-token
        type:
          type: string
          example: pat
        value:
          type: string
          example: ghp_xxx
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiration date-time (RFC3339, UTC recommended).

    Dataset:
      type: object
      required: [id, ownerUserId, name, bucket, prefix, provider, classification, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        name: { type: string }
        description: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        provider:
          type: string
          enum: [minio, s3]
        classification:
          type: string
          enum: [non-hds]
          description: CE supports standard non-HDS datasets. Regulated HDS dataset management is an Enterprise Edition extension.
        endpoint:
          type: string
          description: External S3 endpoint. Empty for platform-managed MinIO datasets.
        region:
          type: string
          description: External S3 region.
        accessRole:
          type: string
          enum: [owner, writer, reader]
          description: Effective permission of the current user.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DatasetListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'

    DatasetObject:
      type: object
      required: [path, key, size, lastModified]
      properties:
        path: { type: string }
        key: { type: string }
        size:
          type: integer
          format: int64
        lastModified:
          type: string
          format: date-time
        contentType: { type: string }

    DatasetObjectListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatasetObject'

    DatasetAccess:
      type: object
      required: [datasetId, userId, role, createdAt, updatedAt]
      properties:
        datasetId: { type: string }
        userId: { type: string }
        role:
          type: string
          enum: [owner, writer, reader]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDatasetRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: fraud-training
        description:
          type: string
        bucket:
          type: string
          example: fraud-analysis-ds
        prefix:
          type: string
          example: raw/2026
        provider:
          type: string
          enum: [minio, s3]
          default: minio
        classification:
          type: string
          enum: [non-hds]
          default: non-hds
        endpoint:
          type: string
          example: https://s3.example.com
        region:
          type: string
          example: custom
        accessKey:
          type: string
          writeOnly: true
        secretKey:
          type: string
          writeOnly: true

    DatasetUploadResponse:
      type: object
      required: [bucket, key, size]
      properties:
        bucket: { type: string }
        key: { type: string }
        size:
          type: integer

    Repository:
      type: object
      required: [id, ownerUserId, name, url, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        name: { type: string }
        url: { type: string }
        defaultRef: { type: string }
        authSecretName: { type: string }
        authType:
          type: string
          enum: [none, persat, prat]
        gitAuthorName: { type: string }
        gitAuthorEmail: { type: string }
        reachable: { type: boolean }
        validationError: { type: string }
        lastValidatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RepositoryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Repository'

    CreateRepositoryRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          example: NoryxLab-CE
        url:
          type: string
          example: https://github.com/Noryxlab/NoryxLab-CE.git
        defaultRef:
          type: string
          example: main
        authSecretName:
          type: string
          example: git-token
        authType:
          type: string
          enum: [none, persat, prat]
        gitAuthorName:
          type: string
          example: Stephane Renouard
        gitAuthorEmail:
          type: string
          example: stephane@example.org

    RepositoryValidationResponse:
      type: object
      required: [repositoryId, reachable, checkedAt]
      properties:
        repositoryId: { type: string }
        reachable: { type: boolean }
        error: { type: string }
        checkedAt:
          type: string
          format: date-time

    SessionCreateResponse:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time

    AdminUsersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    AdminModulesResponse:
      type: object
      properties:
        deployments:
          type: array
          items:
            type: object
            additionalProperties: true

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        occurredAt:
          type: string
          format: date-time
        actorUserId: { type: string }
        actorIp: { type: string }
        actorUserAgent: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        projectId: { type: string }
        outcome: { type: string }
        errorCode: { type: string }
        details:
          type: object
          additionalProperties: true

    AdminAuditResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        services:
          type: array
          items:
            type: object
            additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Not enough permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: Upstream dependency error (Kubernetes, Keycloak, storage, git)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /api/v1/hardware-tiers:
    get:
      summary: List available hardware tiers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareTierListResponse'
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List user projects (auto-create default project on first access)
      security:
        - bearerAuth: []
        - xNoryxUser: []
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Projects]
      summary: Create project
      security:
        - bearerAuth: []
        - xNoryxUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{projectID}:
    put:
      tags: [Projects]
      summary: Update project name and description
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: path
          name: projectID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Delete project
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: path
          name: projectID
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Project deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/projects/{projectID}/members/{userID}/role:
    put:
      tags: [RBAC]
      summary: Set project member role
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: path
          name: projectID
          required: true
          schema: { type: string }
        - in: path
          name: userID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{projectID}/ownership:
    put:
      tags: [Projects]
      summary: Transfer project ownership to a user or organization
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: path
          name: projectID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectOwnerRequest'
      responses:
        '200':
          description: Project owner updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{projectID}/folders:
    post:
      tags: [Projects]
      summary: Create a folder in the persistent project volume
      parameters:
        - in: path
          name: projectID
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Folder created

  /api/v1/builds:
    get:
      tags: [Environments]
      summary: List build submissions
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        '200':
          description: Build list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Environments]
      summary: Submit image build
      security:
        - bearerAuth: []
        - xNoryxUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildRequest'
      responses:
        '201':
          description: Build submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Build'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/builds/{buildID}/dockerfile:
    get:
      tags: [Environments]
      summary: Fetch Dockerfile content for one build revision
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: path
          name: buildID
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dockerfile content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDockerfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/environments:
    get:
      tags: [Environments]
      summary: List environment entries and revisions
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        '200':
          description: Environment catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces:
    get:
      tags: [Workloads]
      summary: List accessible workspaces
      security:
        - bearerAuth: []
        - xNoryxUser: []
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Workloads]
      summary: Launch workspace (jupyter/vscode/rstudio)
      security:
        - bearerAuth: []
        - xNoryxUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/workspaces/{workspaceID}:
    delete:
      tags: [Workloads]
      summary: Stop and delete workspace
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: path
          name: workspaceID
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Workspace deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/cronjobs:
    get:
      tags: [Workloads]
      summary: List accessible scheduled jobs
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronJobListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'
    post:
      tags: [Workloads]
      summary: Create a scheduled job
      security:
        - bearerAuth: []
        - xNoryxUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, image, schedule]
              properties:
                projectId: { type: string }
                name: { type: string }
                image: { type: string }
                hardwareTier: { type: string }
                command:
                  type: array
                  items: { type: string }
                args:
                  type: array
                  items: { type: string }
                schedule:
                  type: string
                  example: "0 8 * * 1-5"
                timeZone:
                  type: string
                  example: Europe/Paris
      responses:
        '201':
          description: Scheduled job created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /api/v1/cronjobs/{cronJobID}:
    delete:
      tags: [Workloads]
      summary: Delete a scheduled job
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - in: path
          name: cronJobID
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Scheduled job deleted
        '401':

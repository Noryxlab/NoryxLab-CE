  /api/v1/admin/activity:
    get:
      tags: [Admin]
      summary: Who used the platform over a period, and what they did
      description: >-
        Read back from the audit log. Distinct from /admin/usage, which counts
        vCPU-hours consumed per project and answers a cost question; this one
        counts people and actions. The daily series counts distinct people
        rather than events, so a bulk import - which writes one audit row per
        object, hundreds of thousands in an afternoon - cannot bury a week of
        real work under a single machine operation. coversSince and coversUntil
        report the period the audit actually holds, which is often narrower
        than the window asked for: a report over ninety days on records that
        begin twelve days ago is not a quiet quarter.
      operationId: getActivityReport
      parameters:
        - in: query
          name: window
          required: false
          schema:
            type: string
            default: 720h
          description: >-
            A Go duration, positive and no longer than a year. Defaults to
            thirty days.
      security:
        - bearerAuth: []
        - xNoryxUser: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/datasets/{datasetID}/credentials:
    put:
      tags: [Datasets]
      summary: Replace the credentials a dataset uses to reach its object store
      description: >-
        Credentials could be set when the dataset was created and never
        afterwards, which held until the day the object store's password was
        rotated: every dataset carries its own encrypted copy, so they all
        stopped being readable at once and the only way back was to recreate
        them, discarding the access rules granted on them.

        The new credentials are proved before they are stored, with a request
        that checks the bucket answers and reads nothing from it. Credentials
        that cannot reach the bucket are refused and the previous ones are left
        in place: saving one that does not work only moves the failure
        somewhere less visible. The access key is recorded in the audit trail,
        the secret is not.
      operationId: updateDatasetCredentials
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - name: datasetID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetCredentialsUpdatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/component-tokens/{tokenID}/rotate:
    post:
      tags: [Admin]
      summary: Issue a replacement credential and revoke the current one
      description: >-
        Same component, scopes and expiry; a new secret, shown once. Server-side and in
        that order, because composed as two calls a failure between them leaves two live
        credentials for one component.
      operationId: rotateComponentToken
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - name: tokenID
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Replacement issued; the secret is shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

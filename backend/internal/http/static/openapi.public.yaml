              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{projectID}/workloads:
    get:
      tags: [Projects]
      summary: List what deleting this project would destroy
      description: >-
        Every workspace, application and job the project holds, with the state
        each is in. Read before a deletion is confirmed, so the person deciding
        sees what is inside. Deleting a project that still holds any of these
        is refused with the same list unless force=true is passed.
      operationId: getProjectWorkloads
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWorkloadList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/ontologies/scans:
    post:
      tags: [Datasets]
      summary: Build an ontology from a dataset
      description: >-
        Walks the dataset and reads its paths with an inference profile,
        producing the ontology that describes what is inside: subjects, visits
        and modalities. No project is involved, because an ontology describes a
        dataset and carries no project. A scan that recognises no subject is
        refused with the shapes it found, rather than creating an empty
        ontology that looks like it worked.


        Scanning a source already described by an ontology the caller can see
        refreshes that ontology and answers 200 with `refreshed: true`; it
        keeps the identifier, the name, the owner, the permissions and the
        extracts declared over it, whose file lists are frozen and therefore
        unaffected. A first scan creates one and answers 201. An ontology the
        caller cannot see is never refreshed - that would be editing somebody
        else's object through a scan.
      operationId: scanOntology
      security:
        - bearerAuth: []
        - xNoryxUser: []
      responses:
        '200':
          description: An existing ontology over the same source was refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyScanResult'
        '201':
          description: A first ontology was created for this source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyScanResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/alerts:
    post:
      tags: [Admin]
      summary: Deliver an alert from a platform component
      description: >-
        The way out for a component that noticed something and has no channel
        of its own. The platform validator ran nightly and recorded its
        failures without announcing them for eight nights; giving it a second
        mail account would have been a second credential to rotate and forget,
        so it says so here and the platform's single notifier delivers it.
        Refused when no destination is configured, rather than accepted and
        discarded.
      operationId: postComponentAlert
      security:
        - bearerAuth: []
        - xNoryxUser: []
      responses:
        '202':
          description: Accepted for delivery to the configured destination
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/team-usage:
    get:
      tags: [Admin]
      summary: Team Usage
      description: >-
        What each team consumed, attributed from the projects it reaches.
        Consumption is sampled per project and never per person, so a team
        figure is an attribution rather than a measurement. A project reached
        by two teams is credited to both in full: splitting it would invent a
        precision nobody measured. The response carries the platform total and
        the attributed total side by side, so the overlap is visible rather
        than deduced, and what no team reaches stays in its own field.
      operationId: getAdminTeamUsage
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamUsageReport' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/team-usage.csv:
    get:
      tags: [Admin]
      summary: Export Team Usage CSV
      description: The same answer in the format a finance team opens.
      operationId: exportAdminTeamUsageCSV
      security:
        - bearerAuth: []
        - xNoryxUser: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to

  /api/v1/admin/storage-capacity:
    get:
      tags: [Admin]
      summary: What the cluster has left to allocate
      description: >-
        What volumes have claimed and what disk is actually unused, side by
        side. They diverge: a cluster can be most of its disk empty and still
        unable to place one more volume, because a provisioner schedules on
        what volumes claim. `available` false means the storage layer could not
        be asked, and every figure is then absent rather than zero.
      operationId: getAdminStorageCapacity
      security:
        - bearerAuth: []
        - xNoryxUser: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageCapacityResponse'

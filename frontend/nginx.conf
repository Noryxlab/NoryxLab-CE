server {
    # Keep all runtime state in the writable temporary filesystem. The
    # Kubernetes pod drops CAP_CHOWN, so nginx must not initialise its default
    # root-owned cache directories under /var/cache/nginx.
    pid /tmp/nginx.pid;
    client_body_temp_path /tmp/nginx-client-temp;
    proxy_temp_path /tmp/nginx-proxy-temp;
    fastcgi_temp_path /tmp/nginx-fastcgi-temp;
    uwsgi_temp_path /tmp/nginx-uwsgi-temp;
    scgi_temp_path /tmp/nginx-scgi-temp;

    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a client-side router: unknown paths must return index.html so
    # a deep link such as /projects/<id>/workspaces resolves after a reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets carry a content hash, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime configuration is mounted from a ConfigMap and changes per
    # deployment, so it must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Enterprise extension modules are mounted from a ConfigMap alongside the
    # built assets, so they change per deployment and must not be cached.
    location /extensions/ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

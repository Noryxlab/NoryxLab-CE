<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Plateforme collaborative de datalab pour les equipes Python et R." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>NoryxLab</title>
    <!--
      Runtime configuration. Mounted from a small Kubernetes ConfigMap, so
      branding, auth and feature flags are configuration rather than a sed
      pass over the built application. Absent in dev: defaults apply.
    -->
    <script src="/config.js"></script>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('noryx.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Noryx a besoin de JavaScript pour fonctionner. Activez-le puis rechargez la page.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

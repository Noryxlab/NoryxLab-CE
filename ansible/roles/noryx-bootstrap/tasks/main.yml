---
- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ noryx_deploy_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy Kubernetes baseline manifests
  ansible.builtin.copy:
    src: "{{ noryx_repo_root }}/deploy/k8s/base/"
    dest: "{{ noryx_deploy_path }}/deploy/k8s/base/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Require explicit platform secrets
  ansible.builtin.fail:
    msg: "Set platform and Harbor credentials with Ansible Vault or extra vars before bootstrap."
  when: >
    (postgres_password | default('')) in ['', 'change-me', 'CHANGE_ME_WITH_ANSIBLE_VAULT_OR_EXTRA_VARS'] or
    (keycloak_admin_password | default('')) in ['', 'change-me', 'CHANGE_ME_WITH_ANSIBLE_VAULT_OR_EXTRA_VARS'] or
    (minio_root_password | default('')) in ['', 'change-me-minio', 'CHANGE_ME_WITH_ANSIBLE_VAULT_OR_EXTRA_VARS'] or
    (noryx_secrets_master_key | default('')) in ['', 'change-me-noryx-master-key', 'CHANGE_ME_WITH_ANSIBLE_VAULT_OR_EXTRA_VARS'] or
    (harbor_robot_username | default('')) in ['', 'CHANGE_ME_WITH_ANSIBLE_VAULT_OR_EXTRA_VARS'] or
    (harbor_robot_password | default('')) in ['', 'CHANGE_ME_WITH_ANSIBLE_VAULT_OR_EXTRA_VARS']

- name: Patch deployment domain and registry placeholders
  ansible.builtin.shell: |
    set -euo pipefail
    find {{ noryx_deploy_path }}/deploy/k8s/base -type f -name '*.yaml' -print0 | xargs -0 sed -i \
      -e 's#datalab.example.local#{{ public_domain }}#g' \
      -e 's#harbor.example.local#{{ harbor_registry_host }}#g'
  args:
    executable: /bin/bash

- name: Patch secret values
  ansible.builtin.lineinfile:
    path: "{{ noryx_deploy_path }}/deploy/k8s/base/secrets.yaml"
    regexp: '^  {{ item.key }}: '
    line: '  {{ item.key }}: "{{ item.value }}"'
  loop:
    - key: POSTGRES_PASSWORD
      value: "{{ postgres_password }}"
    - key: KEYCLOAK_ADMIN_PASSWORD
      value: "{{ keycloak_admin_password }}"
    - key: MINIO_ROOT_PASSWORD
      value: "{{ minio_root_password }}"
    - key: NORYX_SECRETS_MASTER_KEY
      value: "{{ noryx_secrets_master_key }}"
  no_log: true

- name: Apply namespaces before image pull secrets
  ansible.builtin.command: kubectl apply -f {{ noryx_deploy_path }}/deploy/k8s/base/namespace.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create Harbor pull secret in platform namespaces
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n {{ item }} create secret docker-registry harbor-regcred \
      --docker-server={{ harbor_registry_host }} \
      --docker-username='{{ harbor_robot_username }}' \
      --docker-password='{{ harbor_robot_password }}' \
      --docker-email='{{ harbor_robot_email | default("noreply@example.org") }}' \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  loop:
    - "{{ noryx_namespace }}"
    - noryx-loads
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  no_log: true

- name: Apply baseline manifests
  ansible.builtin.command: kubectl apply --server-side --force-conflicts -k {{ noryx_deploy_path }}/deploy/k8s/base
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for PostgreSQL deployment
  ansible.builtin.command: kubectl -n {{ noryx_namespace }} rollout status deploy/postgres --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Keycloak deployment
  ansible.builtin.command: kubectl -n {{ noryx_namespace }} rollout status deploy/keycloak --timeout=240s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for MinIO deployment
  ansible.builtin.command: kubectl -n {{ noryx_namespace }} rollout status deploy/minio --timeout=240s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# Reproducible platform incidents, each with its cause known by construction.
#
# This exists because "does the assistant answer well" is the wrong question.
# The one that decides whether a support agent is a product is: on an incident
# whose cause we already know, does it reach that cause, with evidence, without
# a human. That cannot be measured without a corpus where the answer is known
# in advance - and a platform that has not failed much in production has to
# create its failures deliberately.
#
# Every incident is injected into a namespace of its own and torn down after
# capture. Nothing touches the platform's own workloads.
#
# expect.detail is the vocabulary the platform already emits from
# buildStartupReport. Keeping the ground truth in that vocabulary means the
# corpus scores the whole chain - evidence, classification, diagnosis - rather
# than the model's prose.
namespace: noryx-incidents
incidents:
  - id: image-unavailable
    label: The environment image does not exist in the registry
    expect:
      step: image
      detail: image_unavailable
      stuck: true
    pod:
      image: harbor.lan/noryx-environments/noryx-vscode:does-not-exist
      command: ["sleep", "3600"]

  - id: no-capacity
    label: The workspace asks for more CPU than any node has
    expect:
      step: scheduled
      detail: no_capacity
      stuck: true
    pod:
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "512"

  - id: storage-unavailable
    label: A dataset volume that can never be attached
    expect:
      step: storage
      detail: storage_unavailable
      stuck: true
    pod:
      image: busybox:1.36
      command: ["sleep", "3600"]
      # A PVC bound to a storage class nobody installed: the exact shape of the
      # EMSE afternoon where the S3 driver was missing and every workspace with
      # a dataset waited for an attachment that would never come.
      pvc:
        storageClassName: does-not-exist
        size: 1Gi

  - id: environment-failed
    label: The environment starts and exits immediately
    expect:
      step: environment
      detail: environment_failed
      stuck: true
    pod:
      image: busybox:1.36
      command: ["sh", "-c", "exit 1"]
      restartPolicy: Never

  - id: environment-restarting
    label: The environment restarts in a loop
    expect:
      step: environment
      detail: environment_restarting
      stuck: true
    pod:
      image: busybox:1.36
      command: ["sh", "-c", "sleep 1; exit 1"]
      restartPolicy: Always
      # The classifier calls it a loop above two restarts, so the capture has
      # to wait for the third rather than for the first failure.
      waitForRestarts: 3

  - id: healthy
    label: A workspace that starts normally
    # The negative control, and the one that decides whether this is usable.
    # An agent that finds a fault in a healthy system costs more than no agent.
    expect:
      step: environment
      detail: ""
      stuck: false
    pod:
      image: busybox:1.36
      command: ["sleep", "3600"]
